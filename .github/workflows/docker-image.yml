# Builds the TDEI → R5 walkshed server image (docker/Dockerfile).
#
# Pull requests only build, to check the image still builds. Pushes to dev and version tags also publish to the
# Azure Container Registry that the other TDEI repositories use, as <registry>/tdei-r5, tagged with the branch or
# version and with the full commit hash.
#
# The registry and its login come from the organization's Actions settings, as in those repositories:
#   vars.DOCKERHUB_REGISTRY   the registry's address (despite the name, an Azure Container Registry)
#   vars.DOCKERHUB_USERNAME   the account that pushes
#   secrets.DOCKERHUB_TOKEN   its password
name: Docker image

on:
  push:
    branches: [ dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # The R5 build takes its version from `git describe`, which needs the tags and the history back to them.
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.DOCKERHUB_REGISTRY }}
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Work out image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ vars.DOCKERHUB_REGISTRY }}/tdei-r5
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,format=long,prefix=

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
