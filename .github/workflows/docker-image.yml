# Builds the TDEI → R5 walkshed server image (docker/Dockerfile), and deploys it.
#
# There is a branch for each environment: dev, stage and prod. A push to one of them, which is what merging a pull
# request into it is, builds the image, publishes it, and points that environment's container app at it. So code
# reaches stage by merging dev into stage, and prod by merging stage into prod.
#
#   branch   image tags              container app (resource group tdei-r5)
#   dev      dev, <commit>           tdei-r5-dev
#   stage    stage, <commit>         tdei-r5-stage
#   prod     prod, <commit>          tdei-r5-prod
#
# Each app is pointed at the image by its commit, not by the branch tag, so what an app runs is always a known commit.
#
# Other triggers:
#   - A version tag (v*) builds and publishes, without deploying.
#   - A pull request into dev that touches what goes into the image, other than the Java source, builds it without
#     publishing, to check it still builds. (Java CI already compiles and tests the source.)
#   - A manual run builds and publishes the chosen branch, and deploys it to an environment if one is picked.
#
# Settings, named as in the other TDEI repositories:
#   secrets.REGISTRY_DOMAIN         the container registry's address (repository secret)
#   secrets.REGISTRY_REPO           the image's name in it (repository secret)
#   secrets.REGISTRY_USERNAME       the account that pushes (repository secret)
#   secrets.REGISTRY_PASSWORD       its password (repository secret)
#   secrets.TDEI_CORE_AZURE_CREDS   the Azure login that updates the container apps (organization secret)
name: Docker image

on:
  push:
    branches: [ dev, stage, prod ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev ]
    # Everything the Dockerfile copies in besides the built jar, and what decides how it is built.
    paths:
      - 'docker/**'
      - 'osw-tools/profiles/**'
      - 'src/main/resources/osw-demo/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Also deploy the image to this environment
        type: choice
        options: [ none, dev, stage, prod ]
        default: none

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # The R5 build takes its version from `git describe`, which needs the tags and the history back to them.
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_DOMAIN }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Work out image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Pull requests from forks cannot read the secrets, and do not push, so any valid name will do for them.
        images: ${{ github.event_name == 'pull_request' && 'tdei-r5' || format('{0}/{1}', secrets.REGISTRY_DOMAIN, secrets.REGISTRY_REPO) }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,format=long,prefix=

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        # A pull request can read the layers cached by builds of dev, but nothing else can read the ones it writes,
        # so writing them would be wasted time.
        cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  deploy:
    name: Deploy
    needs: build
    # A push to an environment's branch, or a manual run that names an environment.
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch')
      || (github.event_name == 'workflow_dispatch' && inputs.environment != 'none')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref_name || inputs.environment }}
    # One deployment to an environment at a time, in the order they were started.
    concurrency:
      group: deploy-${{ github.event_name == 'push' && github.ref_name || inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'push' && github.ref_name || inputs.environment }}

    steps:
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}

    - name: Point the container app at the new image
      run: |
        az config set extension.use_dynamic_install=yes_without_prompt
        az containerapp update \
          --name "tdei-r5-$TARGET" \
          --resource-group tdei-r5 \
          --image "${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}" \
          --output none

    - name: Wait for the new revision to be ready
      run: |
        for attempt in $(seq 1 40); do
          state=$(az containerapp show --name "tdei-r5-$TARGET" --resource-group tdei-r5 \
            --query "[properties.latestRevisionName==properties.latestReadyRevisionName, properties.runningStatus]" \
            --output tsv | tr '\n' ' ')
          echo "$state"
          case "$state" in "true Running "*) exit 0 ;; esac
          sleep 10
        done
        echo "The new revision of tdei-r5-$TARGET did not become ready." >&2
        exit 1
