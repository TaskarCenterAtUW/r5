# Builds the TDEI → R5 walkshed server image (docker/Dockerfile).
#
# Pull requests only build, to check the image still builds. Pushes to dev and version tags also publish to the
# Azure Container Registry that the TDEI services use, tagged with the branch or version and with the full commit
# hash. The container apps in the tdei-r5 resource group pull from that registry.
#
# The registry and its login are repository secrets, named as in the TDEI service repositories:
#   REGISTRY_DOMAIN     the registry's address
#   REGISTRY_REPO       the image's name in it
#   REGISTRY_USERNAME   the account that pushes
#   REGISTRY_PASSWORD   its password
name: Docker image

on:
  push:
    branches: [ dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # The R5 build takes its version from `git describe`, which needs the tags and the history back to them.
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_DOMAIN }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Work out image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Pull requests from forks cannot read the secrets, and do not push, so any valid name will do for them.
        images: ${{ github.event_name == 'pull_request' && 'tdei-r5' || format('{0}/{1}', secrets.REGISTRY_DOMAIN, secrets.REGISTRY_REPO) }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,format=long,prefix=

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
