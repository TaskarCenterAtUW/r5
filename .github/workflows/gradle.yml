name: Java CI
# Builds R5 and runs its tests on every commit pushed to any branch, and on pull requests from forks.
# (Triggering on both push and pull_request for branches of this repository would build each commit twice.)
on:
  push:
  pull_request:
jobs:
  build:
    # A pull request from a branch of this repository was already built by its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Start a separate docker container that we can contact over TCP (for tests)
    # https://help.github.com/en/articles/workflow-syntax-for-github-actions#jobsjob_idservices
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
    # Fetch all history and tags: the build takes its version from `git describe`.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Java setup step completes very fast, no need to run in a preconfigured docker container.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: corretto
        java-version: 21
    # The repository has no Gradle wrapper, so pin the version here. The same one builds the Docker image.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'
    - name: Show version string
      run: gradle -q printVersion | head -n1
    - name: Build and test
      run: gradle build
    # Check that build product is able to start up as a backend server
    - name: Ensure backend runnable
      run: |
        cp analysis.properties.template analysis.properties
        gradle testRunnable -x test
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # These assert the same identifiers and costs as PedestrianCostProfileTest, keeping Java and Python in agreement.
    - name: Python profile tests
      working-directory: osw-tools/verification
      run: python -m unittest test_pedestrian_profile
